# Pushing a tag like v1.0.0 builds AviToMp4.exe and publishes it on the Releases page.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: build.bat
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }} AviToMp4.exe
          --title "AVI to MP4 ${{ github.ref_name }}"
          --notes "Download **AviToMp4.exe** and double-click it. Works on Windows 10 and 11 with nothing to install. Add .avi files or a whole folder, press Convert and pick where to save the MP4s."
